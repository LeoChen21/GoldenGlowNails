name: Cut release branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for the release (e.g. v1.0.0 or 1.0.0)"
        required: true
      source:
        description: "Ref to cut from (defaults to main)"
        required: false
        default: main

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Create release/vX.Y.Z branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-branch: ${{ steps.name.outputs.branch }}
    steps:
      - name: Normalize & validate version
        id: name
        env:
          RAW: ${{ inputs.version }}
        run: |
          V="${RAW#v}"                 # strip leading v if present
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid semver. Use vX.Y.Z (e.g. v1.0.0)."
            exit 1
          fi
          BRANCH="release/v${V}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Release branch will be: ${BRANCH}"

      - name: Checkout ${{ inputs.source }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0

      - name: Refuse to overwrite existing release branch
        env:
          BRANCH: ${{ steps.name.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::Branch '$BRANCH' already exists on origin. Bump the version and try again."
            exit 1
          fi

      - name: Push release branch
        env:
          BRANCH: ${{ steps.name.outputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

      - name: Summary
        env:
          BRANCH: ${{ steps.name.outputs.branch }}
        run: |
          {
            echo "### Release branch created"
            echo ""
            echo "**Branch:** \`$BRANCH\`"
            echo ""
            echo "Next: run **Promote release to production** with \`$BRANCH\` as the input."
          } >> "$GITHUB_STEP_SUMMARY"
